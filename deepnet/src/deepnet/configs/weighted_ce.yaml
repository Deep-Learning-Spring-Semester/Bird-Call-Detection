# DEEPNET Weighted CE Configuration
# Day 10 experiment: Weighted Cross-Entropy (inverse sqrt frequency) with best augmentation
# Addresses class imbalance by assigning higher loss weight to rare species
# Compare against focal_loss_v1 and audio_augmented_v1 (label smoothing)

experiment_name: "weighted_ce_v1"

# Data
data:
  batch_size: 32
  num_workers: 4
  use_augmented: true
  weighted_sampling: true

# Model
model:
  num_classes: 18
  dropout: 0.5

# Loss — Weighted CE with inverse sqrt frequency weights
loss:
  type: "weighted_ce"
  class_weights_method: "inverse_sqrt"  # Options: inverse, inverse_sqrt, effective_samples
  smoothing: 0.1        # Unused; kept for reference
  gamma: 2.0            # Unused; kept for reference

# Optimizer
optimizer:
  lr: 0.001
  weight_decay: 0.01
  min_lr: 1.0e-6

# Training
training:
  num_epochs: 50
  patience: 10
  seed: 42

# Augmentation — same as audio_augmented_v1
augmentation:
  spec_augment: true
  freq_mask_param: 15
  time_mask_param: 25
  num_masks: 2
  time_shift: false
  gaussian_noise: false
  mixup: false
  mixup_alpha: 0.3
  cutmix: false
  cutmix_alpha: 1.0

# Paths (relative to project root)
paths:
  data_root: "../data"
  mel_tensors: "processed/mel_tensors"
  checkpoints: "checkpoints"
  logs: "runs"
