# DEEPNET Best Configuration — Week 3
# Assembles Week 2 winners. Updated by hparam_sweep.py after Days 12-13.
# Defaults here: audio augmented + SpecAugment + label smoothing + cosine LR.

experiment_name: "best_v1"

# Data
data:
  batch_size: 32
  num_workers: 4
  use_augmented: true       # Pre-computed audio-augmented tensors in training
  weighted_sampling: true

# Model
model:
  num_classes: 18
  dropout: 0.5

# Loss
loss:
  type: "label_smoothing"
  smoothing: 0.1
  gamma: 2.0
  class_weights_method: "inverse_sqrt"

# Optimizer — values updated by hparam_sweep after sweep finishes
optimizer:
  lr: 0.001
  weight_decay: 0.01
  min_lr: 1.0e-6
  scheduler: "cosine"       # Options: cosine, onecycle, plateau

# Training
training:
  num_epochs: 50
  patience: 15              # Longer patience for final run
  seed: 42

# Augmentation
augmentation:
  spec_augment: true
  freq_mask_param: 15
  time_mask_param: 25
  num_masks: 2
  time_shift: false
  gaussian_noise: false
  mixup: false
  mixup_alpha: 0.3
  cutmix: false
  cutmix_alpha: 1.0

# Paths (relative to deepnet/)
paths:
  data_root: "../data"
  mel_tensors: "processed/mel_tensors"
  checkpoints: "checkpoints"
  logs: "runs"
  results: "results"
