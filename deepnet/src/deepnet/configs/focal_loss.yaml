# DEEPNET Focal Loss Configuration
# Day 10 experiment: Focal Loss (gamma=2.0) with best augmentation from Day 9
# Focal Loss focuses training on hard/misclassified examples by down-weighting
# easy examples — beneficial for rare classes and borderline samples

experiment_name: "focal_loss_v1"

# Data
data:
  batch_size: 32
  num_workers: 4
  use_augmented: true
  weighted_sampling: true

# Model
model:
  num_classes: 18
  dropout: 0.5

# Loss — Focal Loss (compare against baseline label_smoothing and weighted_ce)
loss:
  type: "focal"
  gamma: 2.0            # Focusing parameter (0=CE, 2=standard focal)
  smoothing: 0.1        # Unused for focal; kept for reference
  class_weights_method: "inverse_sqrt"

# Optimizer
optimizer:
  lr: 0.001
  weight_decay: 0.01
  min_lr: 1.0e-6

# Training
training:
  num_epochs: 50
  patience: 10
  seed: 42

# Augmentation — same as audio_augmented_v1
augmentation:
  spec_augment: true
  freq_mask_param: 15
  time_mask_param: 25
  num_masks: 2
  time_shift: false
  gaussian_noise: false
  mixup: false
  mixup_alpha: 0.3
  cutmix: false
  cutmix_alpha: 1.0

# Paths (relative to project root)
paths:
  data_root: "../data"
  mel_tensors: "processed/mel_tensors"
  checkpoints: "checkpoints"
  logs: "runs"
